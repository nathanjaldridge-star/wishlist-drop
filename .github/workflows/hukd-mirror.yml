# LIVE since 24 Oct 2026. Editing this file needs a token with the `workflow` scope (or the GitHub web UI).
# Free on public repos. Fetches ONLY public HotUKDeals RSS feeds; no retailer pages.
#
# Cadence: the plan wants /rss/new every 5 min (2 min from 20 Nov to 1 Dec). GitHub Actions' shortest schedule is every
# 5 minutes, and scheduled runs can start late or be skipped under load, so 2-minute polling is NOT possible here.
# The script gates each feed itself (new 5m / 2m in BF week, trending 15m, vouchers + tags 30m), so this job just wakes
# every 5 min. For true 2-minute polling in Black Friday week, see docs/cloudflare-worker-cron.md (needs Nathan's approval:
# it's a free sign-up).
#
# Output goes to the `data` branch (not main), so frequent updates don't trigger GitHub Pages builds (soft limit ~10/hour).
name: Mirror HotUKDeals RSS
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: hukd-mirror, cancel-in-progress: false }
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MYSQL_URL: ${{ secrets.MYSQL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: mirror }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Self-test the fetcher (offline, local server)
        run: node scripts/test-fetch-hukd.mjs
      - name: Install the MySQL client when a database is configured
        if: env.MYSQL_URL != ''
        run: npm install --omit=dev
      - name: Fetch due feeds (conditional GET, 15s timeout, validated, merchant-filtered; appends price log)
        env: { HUKD_OUT: mirror/hukd.json, HUKD_LOG: mirror/price-log.jsonl }
        run: node scripts/fetch-hukd.mjs
      - name: Commit to the data branch if changed
        working-directory: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The eBay job (ebay-prices.yml) also appends to price-log.jsonl: union-merge keeps both sides' lines.
          echo 'price-log.jsonl merge=union' >> .git/info/attributes
          git add hukd.json price-log.jsonl
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: HotUKDeals mirror $(date -u +%FT%TZ)"
          git pull --rebase && git push
